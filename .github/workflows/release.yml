name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/YandexMusicDiscord.Tests/YandexMusicDiscord.Tests.csproj -c Release
      - name: Publish
        run: dotnet publish src/YandexMusicDiscord/YandexMusicDiscord.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64
      - name: Pack
        shell: pwsh
        run: |
          Copy-Item README.md dist/win-x64/README.md
          Copy-Item LICENSE dist/win-x64/LICENSE
          Compress-Archive -Path dist/win-x64/YandexMusicDiscord.exe,dist/win-x64/README.md,dist/win-x64/LICENSE -DestinationPath dist/YandexMusicDiscord-win-x64.zip
          (Get-FileHash dist/YandexMusicDiscord-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  YandexMusicDiscord-win-x64.zip' | Set-Content dist/SHA256SUMS.txt
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/YandexMusicDiscord-win-x64.zip dist/SHA256SUMS.txt --generate-notes --title "Yandex Music for Discord ${{ github.ref_name }}"

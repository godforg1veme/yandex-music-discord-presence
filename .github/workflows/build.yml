name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/YandexMusicDiscord.Tests/YandexMusicDiscord.Tests.csproj -c Release
      - name: Publish
        run: dotnet publish src/YandexMusicDiscord/YandexMusicDiscord.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64
      - uses: actions/upload-artifact@v6
        with:
          name: YandexMusicDiscord-win-x64
          path: dist/win-x64/YandexMusicDiscord.exe

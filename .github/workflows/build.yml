name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/YandexMusicPresence.Tests/YandexMusicPresence.Tests.csproj -c Release
      - name: Publish
        run: dotnet publish src/YandexMusicPresence/YandexMusicPresence.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: YandexMusicPresence-win-x64
          path: dist/win-x64/YandexMusicPresence.exe
